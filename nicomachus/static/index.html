<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicomachus</title>
<style>
:root{
  --bg:#faf8f4; --panel:#fffefb; --ink:#1f1c17; --muted:#6b6459;
  --line:#e3ddd1; --accent:#7a5c2e; --accent-soft:#f0e7d6;
  --warn:#8a4b2a; --ok:#3f6b45;
  --radius:10px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Cascadia Code",Consolas,"SF Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16150f; --panel:#1d1c15; --ink:#e9e3d6; --muted:#a09883;
    --line:#332f24; --accent:#d3ad6a; --accent-soft:#2a2519;
    --warn:#d99a6c; --ok:#8fc09a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}

/* layout */
.shell{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
@media(max-width:820px){.shell{grid-template-columns:1fr}}

aside{
  border-right:1px solid var(--line); background:var(--panel);
  padding:20px 14px; display:flex; flex-direction:column; gap:18px;
}
@media(max-width:820px){aside{border-right:none;border-bottom:1px solid var(--line)}}

.brand{padding:0 8px}
.brand h1{
  font-family:var(--serif); font-size:21px; font-weight:600;
  margin:0; letter-spacing:.01em;
}
.brand p{margin:3px 0 0;font-size:11.5px;color:var(--muted);line-height:1.4}

nav{display:flex;flex-direction:column;gap:2px}
@media(max-width:820px){nav{flex-direction:row;flex-wrap:wrap}}
nav button{
  background:none;border:none;text-align:left;padding:7px 10px;
  border-radius:7px;cursor:pointer;color:var(--muted);font-size:14px;
}
nav button:hover{background:var(--accent-soft);color:var(--ink)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}

.stat{padding:0 8px;font-size:11.5px;color:var(--muted);line-height:1.7}
.stat b{color:var(--ink);font-weight:600}
.stat hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.stat select{
  width:100%;margin-top:4px;padding:5px 6px;background:var(--bg);
  border:1px solid var(--line);border-radius:6px;font-size:12px;
}

main{padding:28px 34px 60px;max-width:900px}
@media(max-width:820px){main{padding:20px 16px 40px}}
h2.view-title{
  font-family:var(--serif);font-size:25px;font-weight:600;
  margin:0 0 4px;letter-spacing:.01em;
}
.sub{color:var(--muted);font-size:13px;margin:0 0 22px}

/* controls */
.ask-row{display:flex;gap:8px;margin-bottom:8px}
.ask-row textarea{
  flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);resize:vertical;min-height:52px;font-size:15px;
  font-family:var(--sans);
}
.ask-row textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{
  padding:9px 16px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);cursor:pointer;white-space:nowrap;font-size:14px;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:var(--bg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.row input[type=text]{
  flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);
}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 9px;
  border:1px solid var(--line);border-radius:20px;font-size:12px;
  cursor:pointer;color:var(--muted);background:var(--panel);
}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}

/* content */
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;
}
.prose{font-family:var(--serif);font-size:16.5px;line-height:1.68}
.prose h1,.prose h2,.prose h3{font-family:var(--serif);line-height:1.3;margin:1.3em 0 .45em}
.prose h1{font-size:1.4em}.prose h2{font-size:1.22em}.prose h3{font-size:1.08em}
.prose p{margin:0 0 .85em}
.prose ul,.prose ol{margin:0 0 .85em;padding-left:1.3em}
.prose li{margin:.2em 0}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);padding:1px 4px;border-radius:4px}
.prose strong{font-weight:650}
.prose em{font-style:italic}
.prose table{border-collapse:collapse;width:100%;margin:0 0 1em;font-size:.92em}
.prose th,.prose td{border:1px solid var(--line);padding:5px 9px;text-align:left}
.prose th{background:var(--accent-soft)}
.scroll-x{overflow-x:auto}

.muted{color:var(--muted)}
.small{font-size:12.5px}
.cite{
  display:block;padding:7px 0;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted);
}
.cite a{color:var(--accent)}
.cite b{color:var(--ink);font-weight:600}

.badge{
  display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;
  border:1px solid var(--line);color:var(--muted);
}
.badge.operational{color:var(--warn);border-color:var(--warn)}
.badge.defensive,.badge.established{color:var(--ok);border-color:var(--ok)}

.item{
  padding:12px 14px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);margin-bottom:8px;cursor:pointer;
}
.item:hover{border-color:var(--accent)}
.item h4{margin:0 0 3px;font-size:14.5px;font-weight:600}
.item p{margin:0;font-size:12.5px;color:var(--muted)}

.spinner{
  display:inline-block;width:13px;height:13px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;
  vertical-align:-2px;margin-right:7px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--warn);font-size:13px}
.hidden{display:none}
.log{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:pre-wrap}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <h1>Nicomachus</h1>
      <p>philosophy · psychology<br>political theory · rhetoric</p>
    </div>
    <nav id="nav"></nav>
    <div class="stat" id="stat">loading…</div>
  </aside>
  <main id="main"></main>
</div>

<script>
"use strict";

const VIEWS = [
  ["ask",       "Ask"],
  ["library",   "Library"],
  ["questions", "Questions"],
  ["notes",     "Notes"],
  ["study",     "Study"],
  ["charter",   "Charter"],
];

const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h; return d; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({ error: "bad response" }));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const post = (path, body) => api(path, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body || {}),
});

// Poll a job until it settles.
async function runJob(path, body, onTick) {
  const { job } = await post(path, body);
  for (let i = 0; ; i++) {
    await new Promise(r => setTimeout(r, i < 10 ? 400 : 1200));
    const s = await api("/api/job/" + job);
    if (onTick) onTick(i);
    if (s.state === "done") return s.result;
    if (s.state === "error") throw new Error(s.error);
  }
}

/* A deliberately small Markdown subset: headings, lists, tables, bold,
   italic, code, links. The model writes prose, not documents. */
function md(src) {
  const lines = String(src || "").split("\n");
  const out = [];
  // List items are buffered rather than emitted immediately: a wrapped
  // continuation line belongs to the item above it, not to a new paragraph.
  // Emitting per line restarted the <ol> on every wrap, so every item
  // rendered as "1.".
  let list = null, items = [], para = [], table = null;

  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
             '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,
             '$1<a href="$2" target="_blank" rel="noopener">$2</a>');

  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const flushList = () => {
    if (!list) return;
    out.push(`<${list}>` + items.map(t => `<li>${inline(t)}</li>`).join("") + `</${list}>`);
    list = null; items = [];
  };
  const flushTable = () => {
    if (!table) return;
    const cells = r => r.split("|").slice(1, -1).map(c => c.trim());
    const head = cells(table[0]);
    const rows = table.slice(2).map(cells);
    out.push('<div class="scroll-x"><table><thead><tr>'
      + head.map(h => `<th>${inline(h)}</th>`).join("")
      + "</tr></thead><tbody>"
      + rows.map(r => "<tr>" + r.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("")
      + "</tbody></table></div>");
    table = null;
  };
  const flushAll = () => { flushPara(); flushList(); flushTable(); };

  for (const raw of lines) {
    const line = raw.trimEnd();

    if (/^\s*\|.*\|\s*$/.test(line)) { flushPara(); flushList(); (table ||= []).push(line.trim()); continue; }
    else if (table) flushTable();

    if (!line.trim()) { flushAll(); continue; }

    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { flushAll(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }

    const ul = line.match(/^\s*[-*·]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      flushPara();
      const want = ul ? "ul" : "ol";
      if (list !== want) flushList();
      list = want;
      items.push((ul || ol)[1]);
      continue;
    }
    // Inside a list, a plain line is the wrapped remainder of the item above.
    if (list && items.length) { items[items.length - 1] += " " + line.trim(); continue; }
    para.push(line.trim());
  }
  flushAll();
  return out.join("\n");
}

/* ---------------- state ---------------- */
let view = location.hash.slice(1) || "ask";
let status = null;

function renderNav() {
  document.getElementById("nav").innerHTML = VIEWS.map(([id, label]) =>
    `<button data-v="${id}" aria-current="${id === view}">${label}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b =>
    b.onclick = () => { location.hash = b.dataset.v; });
}

async function refreshStatus() {
  try { status = await api("/api/status"); } catch { return; }
  const q = status.questions || {};
  const provOpts = ["auto", "anthropic", "gemini"].map(p =>
    `<option value="${p}" ${status.preference === p ? "selected" : ""}>${p}</option>`).join("");
  document.getElementById("stat").innerHTML = `
    <b>${status.corpus.documents}</b> documents<br>
    <b>${status.chunks.toLocaleString()}</b> passages indexed<br>
    <b>${status.notes}</b> notes · <b>${q.open || 0}</b> open questions
    <hr>
    ${status.provider
      ? `model <b>${esc(status.provider)}</b>`
      : `<span style="color:var(--warn)">offline — no API key</span>`}
    <select id="provsel">${provOpts}</select>`;
  const sel = document.getElementById("provsel");
  if (sel) sel.onchange = async () => {
    await post("/api/provider", { provider: sel.value });
    refreshStatus();
  };
}

/* ---------------- views ---------------- */
const main = () => document.getElementById("main");

function head(title, sub) {
  return `<h2 class="view-title">${title}</h2><p class="sub">${sub}</p>`;
}

function viewAsk() {
  main().innerHTML = head("Ask", "Answered from the corpus, with the passages it used.") + `
    <div class="ask-row">
      <textarea id="q" placeholder="What does the evidence say about detecting deception from body language?"></textarea>
    </div>
    <div class="row">
      <button class="btn primary" id="go">Ask</button>
      <button class="btn" id="go-research">Research live</button>
      <span class="small muted" id="hint">Enter to send · Shift+Enter for a new line</span>
    </div>
    <div id="out"></div>`;

  const q = document.getElementById("q"), out = document.getElementById("out");
  q.focus();

  async function ask(live) {
    const question = q.value.trim();
    if (!question) return;
    const btns = document.querySelectorAll("#go,#go-research");
    btns.forEach(b => b.disabled = true);
    out.innerHTML = `<div class="card"><span class="spinner"></span>
      <span class="muted small">${live ? "searching the web" : "reading the corpus"}…</span></div>`;
    try {
      const r = live
        ? await runJob("/api/research", { topic: question })
        : await runJob("/api/ask", { question });
      renderAnswer(out, r);
    } catch (e) {
      out.innerHTML = `<div class="card err">${esc(e.message)}</div>`;
    } finally {
      btns.forEach(b => b.disabled = false);
      refreshStatus();
    }
  }
  document.getElementById("go").onclick = () => ask(false);
  document.getElementById("go-research").onclick = () => ask(true);
  q.onkeydown = e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(false); }
  };
}

function renderAnswer(el, r) {
  const stance = r.stance && r.stance !== "scholarly"
    ? `<span class="badge ${esc(r.stance)}">${esc(r.stance)}</span> ` : "";
  const foot = r.offline
    ? `<p class="small muted">Offline mode — ranked passages, no synthesis.
       Set ANTHROPIC_API_KEY or GEMINI_API_KEY for written answers.</p>`
    : (r.provider ? `<p class="small muted">${esc(r.provider)}/${esc(r.model)}${
        r.usage && r.usage.input ? ` · ${r.usage.input} in / ${r.usage.output} out tokens` : ""
      }</p>` : "");

  const cites = (r.citations || []).length
    ? `<div class="card"><p class="small muted" style="margin:0 0 6px">Sources</p>`
      + r.citations.map(c => `<span class="cite">
          <b>[${c.n}]</b> ${esc(c.title)}${c.author ? " — " + esc(c.author) : ""}
          ${c.source ? `<br><a href="${esc(c.source)}" target="_blank" rel="noopener">${esc(c.source)}</a>` : ""}
        </span>`).join("") + `</div>`
    : "";

  el.innerHTML = `<div class="card">${stance}<div class="prose">${md(r.text)}</div>${foot}</div>${cites}`;
}

async function viewLibrary() {
  main().innerHTML = head("Library", "Everything in the corpus. Curated notes first.")
    + `<div class="row"><input type="text" id="filter" placeholder="filter by title or author…"></div>
       <div id="list"><span class="spinner"></span></div>`;
  const { documents } = await api("/api/library");
  const list = document.getElementById("list");

  const draw = (docs) => {
    list.innerHTML = docs.map((d, i) => `
      <div class="item" data-i="${documents.indexOf(d)}">
        <h4>${esc(d.title)} ${d.curated ? '<span class="badge">curated</span>' : ""}</h4>
        <p>${d.author ? esc(d.author) + " · " : ""}${d.chars.toLocaleString()} chars
           ${d.licence ? " · " + esc(d.licence) : ""}</p>
      </div>`).join("") || `<p class="muted">Nothing matches.</p>`;
    list.querySelectorAll(".item").forEach(el =>
      el.onclick = () => openDoc(documents[+el.dataset.i]));
  };
  draw(documents);
  document.getElementById("filter").oninput = (e) => {
    const t = e.target.value.toLowerCase();
    draw(documents.filter(d =>
      d.title.toLowerCase().includes(t) || (d.author || "").toLowerCase().includes(t)));
  };
}

async function openDoc(d) {
  main().innerHTML = `<button class="btn" id="back">← Library</button>
    <div style="height:16px"></div><div id="doc"><span class="spinner"></span></div>`;
  document.getElementById("back").onclick = viewLibrary;
  try {
    const doc = await api("/api/document?path=" + encodeURIComponent(d.path));
    document.getElementById("doc").innerHTML = `
      <h2 class="view-title">${esc(doc.title)}</h2>
      <p class="sub">${doc.author ? esc(doc.author) + " · " : ""}${esc(doc.licence || "")}
        ${doc.source ? ` · <a href="${esc(doc.source)}" target="_blank" rel="noopener">source</a>` : ""}</p>
      <div class="card prose">${md(doc.body)}</div>`;
  } catch (e) {
    document.getElementById("doc").innerHTML = `<p class="err">${esc(e.message)}</p>`;
  }
}

async function viewQuestions() {
  main().innerHTML = head("Its own questions",
    "Generated while reading. These decide what it studies next — click one to study it now.")
    + `<div id="list"><span class="spinner"></span></div>`;
  const { questions } = await api("/api/questions");
  const list = document.getElementById("list");
  if (!questions.length) {
    list.innerHTML = `<p class="muted">No open questions yet. Run a study cycle.</p>`;
    return;
  }
  list.innerHTML = questions.map((q, i) =>
    `<div class="item" data-i="${i}"><h4>${esc(q.question)}</h4>
     <p>${q.topic ? "from: " + esc(q.topic) : ""}</p></div>`).join("");
  list.querySelectorAll(".item").forEach(el => el.onclick = () => {
    location.hash = "study";
    setTimeout(() => {
      const f = document.getElementById("topic");
      if (f) { f.value = questions[+el.dataset.i].question; f.focus(); }
    }, 60);
  });
}

async function viewNotes() {
  main().innerHTML = head("Notes", "Claims it wrote down while reading, with provenance.")
    + `<div id="list"><span class="spinner"></span></div>`;
  const { notes } = await api("/api/notes");
  document.getElementById("list").innerHTML = notes.length
    ? notes.map(n => `<div class="card">
        <span class="badge ${esc(n.confidence)}">${esc(n.confidence)}</span>
        <span class="small muted"> ${esc(n.topic)}</span>
        <p style="margin:8px 0 0">${esc(n.claim)}</p>
        ${n.provenance ? `<p class="small muted" style="margin:6px 0 0">← ${esc(n.provenance).slice(0, 160)}</p>` : ""}
      </div>`).join("")
    : `<p class="muted">No notes yet. Notes are written during a study cycle,
       which needs an API key — see the sidebar.</p>`;
}

function viewStudy() {
  main().innerHTML = head("Study", "Harvest open sources, or run a full self-directed cycle.") + `
    <div class="card">
      <p class="small muted" style="margin:0 0 10px"><b>Learn a topic</b> — fetch and index new material.</p>
      <div class="row">
        <input type="text" id="topic" placeholder="e.g. Stoicism Epictetus ethics">
        <button class="btn primary" id="learn">Harvest</button>
      </div>
      <div class="row" id="srcs"></div>
    </div>
    <div class="card">
      <p class="small muted" style="margin:0 0 10px"><b>Study cycle</b> — pick up its own open
        questions, read, distil notes, generate new questions, reindex.</p>
      <div class="row" style="margin:0">
        <button class="btn" id="cycle">Run a cycle</button>
        <button class="btn" id="auto">Study on its own ×2</button>
        <button class="btn" id="reflect">Reflect</button>
      </div>
    </div>
    <div id="out"></div>`;

  const SOURCES = ["wikipedia", "openalex", "arxiv", "pubmed", "gutenberg"];
  const chosen = new Set(["wikipedia", "openalex", "arxiv"]);
  const srcs = document.getElementById("srcs");
  srcs.innerHTML = `<span class="small muted">sources:</span> ` + SOURCES.map(s =>
    `<button class="chip" data-s="${s}" aria-pressed="${chosen.has(s)}">${s}</button>`).join("");
  srcs.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const s = c.dataset.s;
    chosen.has(s) ? chosen.delete(s) : chosen.add(s);
    c.setAttribute("aria-pressed", chosen.has(s));
  });

  const out = document.getElementById("out");
  const busy = (msg) => out.innerHTML =
    `<div class="card"><span class="spinner"></span><span class="muted small">${msg}</span></div>`;

  document.getElementById("learn").onclick = async () => {
    const topic = document.getElementById("topic").value.trim();
    if (!topic) return;
    busy(`harvesting ${esc(topic)}…`);
    try {
      const r = await runJob("/api/learn", { topic, sources: [...chosen] });
      out.innerHTML = `<div class="card">
        <p style="margin:0 0 8px"><b>${r.harvested.length}</b> new document(s) ·
          corpus now ${r.documents} documents, ${r.chunks.toLocaleString()} passages</p>
        ${r.harvested.map(h => `<span class="cite"><b>${esc(h.title)}</b>
          <br><a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.url)}</a>
          · ${h.chars.toLocaleString()} chars</span>`).join("")
          || '<p class="muted small">Nothing new — it had already read these.</p>'}
      </div>`;
    } catch (e) { out.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
    refreshStatus();
  };

  document.getElementById("cycle").onclick = async () => {
    const topic = document.getElementById("topic").value.trim();
    busy("studying — harvesting, reading, distilling…");
    try {
      const r = await runJob("/api/study", { topics: topic ? [topic] : [] });
      out.innerHTML = `<div class="card">
        <p style="margin:0 0 8px"><b>Cycle complete.</b></p>
        <div class="log">studied     ${r.targets.map(esc).join("\n            ")}
harvested   ${r.harvested} document(s)
notes kept  ${r.notes}
questions   ${r.questions} new
index       ${r.indexed.toLocaleString()} passages${
  r.errors.length ? "\nerrors      " + r.errors.map(esc).join("\n            ") : ""}</div>
      </div>`;
    } catch (e) { out.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
    refreshStatus();
  };

  const renderReflection = (r) => {
    if (r.offline) return `<div class="card err">Reflection needs an API key.</div>`;
    const list = (title, arr) => (arr && arr.length)
      ? `<p class="small muted" style="margin:14px 0 6px"><b>${title}</b></p><ul class="prose">`
        + arr.map(x => `<li>${esc(x)}</li>`).join("") + `</ul>` : "";
    return `<div class="card">
      ${r.standing ? `<p class="prose" style="margin:0">${esc(r.standing)}</p>` : ""}
      ${list("Worth knowing, to not be worked on", r.protective)}
      ${list("Revising", r.revise)}
      ${list("Reading next", r.next)}
    </div>`;
  };

  document.getElementById("reflect").onclick = async () => {
    busy("thinking over what it has read…");
    try { out.innerHTML = renderReflection(await runJob("/api/reflect", {})); }
    catch (e) { out.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
    refreshStatus();
  };

  document.getElementById("auto").onclick = async () => {
    busy("studying unattended — this takes a few minutes…");
    try {
      const r = await runJob("/api/autonomous", { rounds: 2 });
      out.innerHTML = `<div class="card"><p style="margin:0"><b>${r.rounds} rounds.</b>
        ${r.harvested} documents · ${r.notes} notes · ${r.questions} new questions</p></div>`
        + renderReflection(r.reflection || {});
    } catch (e) { out.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
    refreshStatus();
  };
}

async function viewCharter() {
  main().innerHTML = head("Charter", "The rules it operates under.")
    + `<div id="c"><span class="spinner"></span></div>`;
  const { charter } = await api("/api/charter");
  document.getElementById("c").innerHTML = `<div class="card prose">${md(charter)}</div>
    <div class="card">
      <p class="small muted" style="margin:0 0 8px">Test how it reads a question:</p>
      <div class="row">
        <input type="text" id="cq" placeholder="how do I get my flatmate to move out">
        <button class="btn" id="cgo">Check</button>
      </div>
      <div id="cout"></div>
    </div>`;
  const go = async () => {
    const question = document.getElementById("cq").value.trim();
    if (!question) return;
    const r = await post("/api/check", { question });
    document.getElementById("cout").innerHTML =
      `<p style="margin:10px 0 0"><span class="badge ${esc(r.stance)}">${esc(r.stance)}</span></p>
       <p class="small muted" style="margin:6px 0 0">${esc(r.reason)}</p>`;
  };
  document.getElementById("cgo").onclick = go;
  document.getElementById("cq").onkeydown = e => { if (e.key === "Enter") go(); };
}

const RENDER = {
  ask: viewAsk, library: viewLibrary, questions: viewQuestions,
  notes: viewNotes, study: viewStudy, charter: viewCharter,
};

function route() {
  view = location.hash.slice(1) || "ask";
  if (!RENDER[view]) view = "ask";
  renderNav();
  main().innerHTML = "";
  Promise.resolve(RENDER[view]()).catch(e =>
    main().innerHTML = `<p class="err">${esc(e.message)}</p>`);
}

window.addEventListener("hashchange", route);
refreshStatus();
route();
</script>
